name: Keep API awake

# Render's free plan puts the API to sleep after 15 idle minutes, and waking
# it takes ~50 seconds. A light ping every 10 minutes keeps the live demo fast.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 --retry 2 "${{ vars.API_URL || 'https://duo-api-tumt.onrender.com' }}/health"
